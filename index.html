<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر رف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="hero" id="hero" aria-hidden="true"></div><h1>📚 متجر رف</h1><p>كل أنواع الكتب في مكان واحد</p>
<div class="search"><input id="q" autocomplete="off" placeholder="🔍 ابحث عن كتاب..." oninput="render()"></div></header>
<div class="marquee home-only" aria-hidden="true"><div class="track" id="track"></div></div>
<nav></nav>

<section id="authors" class="home-only"><h2>✍️ المؤلفون</h2><div class="authors" id="authorsGrid"></div></section>
<section id="folders" class="home-only"><h2>📂 أقسام الكتب</h2><div class="folders" id="foldersGrid"></div></section>
<section id="pageView" hidden><div class="vhead"><button class="back" onclick="goHome()">→ الرجوع للرئيسية</button></div><h2 id="vTitle"></h2><div class="grid" id="vGrid"></div></section>

<footer>للتواصل: <span dir="ltr">0540711530</span> &nbsp;|&nbsp; متجر رف © 2026</footer>

<div id="popup" onclick="closeItem()"><div id="box" onclick="event.stopPropagation()">
<img id="pImg" alt=""><h2 id="pName" style="border:0;padding:0;margin:12px 0 4px"></h2>
<p class="price" id="pPrice"></p><ul id="pList"></ul><div class="btns"><button class="add" onclick="addToCart(cur)">أضف للسلة</button><button onclick="closeItem()">إغلاق</button></div></div></div>

<div id="shade" onclick="closeCart()"></div>
<aside id="drawer" aria-label="السلة">
<div class="dhead"><h2>سلتك</h2><button class="x" onclick="closeCart()" aria-label="إغلاق السلة">✕</button></div>
<div id="cartList"></div>
<div class="dfoot"><p id="cartTotal"></p><button class="add wide" id="checkoutBtn" onclick="checkout()">إرسال الطلب عبر واتساب</button><p class="note">التوصيل والتوفر نؤكدهم معك قبل التجهيز</p></div>
</aside>
<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button onclick="openCart()">عرض السلة</button></div>

<script src="books2.js"></script>
<script src="script.js"></script>
</body>
</html>
